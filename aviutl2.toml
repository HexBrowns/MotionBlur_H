#:schema ./.aviutl2-cli/aviutl2.schema.json
#
# ビルドと配布の設定（aviutl2-cli: https://github.com/sevenc-nanashi/aviutl2-cli）。
#   au2 release   テストしてからビルドし、release/ に au2pkg とカタログ用の catalog.json を作る
# project.version は Cargo.toml の version と揃える。
# シェーダー（shaders/blur.hlsl）は build.rs が Windows SDK の fxc でコンパイルして埋め込む。

[project]
id = "HexBrowns.MotionBlur_H"
name = "MotionBlur_H"
version = "0.3.1"

[artifacts."MotionBlur_H.aux2"]
build = "cargo build --release"
source = "target/release/motion_blur_h.dll"
destination = "Plugin/MotionBlur_H/MotionBlur_H.aux2"

[release]
# テストの後、インストール時のダイアログに本体・原作・依存クレートのライセンスを出す
prebuild = [
    "cargo test",
    'copy /b /y LICENSE + THIRD_PARTY_LICENSES.md + THIRD_PARTY_CRATES.md release\package.txt >nul',
]
package_template = "release/package.txt"
package_information = "{name} v{version} by HexBrowns"

[catalog]
id = "HexBrowns.MotionBlur_H"
license_path = { type = "MIT", path = "./LICENSE" }
download_repo = { owner = "HexBrowns", repo = "MotionBlur_H" }
